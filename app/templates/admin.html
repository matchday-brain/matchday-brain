
<!doctype html>
<html>
<head>
  <title>Invictus Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="overflow:auto">
<div class="admin">
  <div class="logoBlock" style="padding-left:0"><img src="{{ url_for('static', filename='img/invictus-logo.png') }}"><div class="wordmark">INVICTUS<span>ADMIN</span></div></div>
  <h1>Module Admin</h1>
  {% if saved %}<p style="color:var(--lime);font-weight:900">Saved successfully.</p>{% endif %}
  <p><a href="/" class="primary outline">Back to Website</a></p>
  <form method="post">
    <table>
      <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Width mm</th><th>Description</th></tr></thead>
      <tbody>
      {% for m in modules %}
      <tr>
        <td><input name="{{m.id}}_name" value="{{m.name}}"></td>
        <td><input name="{{m.id}}_category" value="{{m.category}}"></td>
        <td><input name="{{m.id}}_price" value="{{m.price}}"></td>
        <td><input name="{{m.id}}_width" value="{{m.width}}"></td>
        <td><input name="{{m.id}}_description" value="{{m.description}}"></td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
    <p><button class="primary">Save Changes</button></p>
  </form>
</div>
</body>
</html>
