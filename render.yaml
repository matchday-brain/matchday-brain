services:
  - type: web
    name: matchday-brain-worldcup
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PUBLIC_BASE_URL
        sync: false
