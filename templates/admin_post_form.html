{% extends "base.html" %}
{% block content %}
<section class="section-head">
  <div>
    <p class="eyebrow">Post planner</p>
    <h1>New X post</h1>
  </div>
  <a class="btn ghost" href="{{ url_for('admin_posts') }}">Back</a>
</section>

<section class="form-card">
  <form method="post" class="predict-form">
    <label>Title
      <input name="title" placeholder="Saturday morning promo" required>
    </label>
    <label>Post text
      <textarea name="body" rows="8" placeholder="Matchday is here..." required></textarea>
    </label>
    <label>Scheduled time
      <input name="scheduled_at" placeholder="2026-08-22 11:30">
    </label>
    <label>Status
      <select name="status">
        <option>draft</option>
        <option>scheduled</option>
      </select>
    </label>
    <label>Link URL
      <input name="link_url" placeholder="https://...">
    </label>
    <label>Image/card note
      <input name="image_note" placeholder="Use Derby v Forest graphic">
    </label>
    <button class="btn primary full" type="submit">Create post</button>
  </form>
</section>
{% endblock %}
